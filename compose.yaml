services:
  app:
    build: .
    image: counter-app
    ports:
      - "${HOST_PORT:-8080}:8000"
    environment:
      STORAGE: redis
      REDIS_URL: redis://redis:6379/0
      GREETING: "${GREETING:-Hello, Docker!}"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
